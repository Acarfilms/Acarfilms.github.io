<linearGradient id="wp-wave-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B4FD6"/><stop offset="1" stop-color="#0A1F6B"/></linearGradient>
<linearGradient id="wp-wave-1" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#2E8BFF"/><stop offset="0.5" stop-color="#1F5BEA"/><stop offset="1" stop-color="#5B4BE0"/></linearGradient>
<linearGradient id="wp-wave-2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5FD3FF"/><stop offset="0.5" stop-color="#3A8DFF"/><stop offset="1" stop-color="#FF8A5C"/></linearGradient>
